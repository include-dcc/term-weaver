[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "term-weaver"
description = "Enumeration Materialization"
readme = "README.md"
requires-python = ">=3.12,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "requests",
    "linkml",
    "PyYAML",
    "jinja2",
    "search-dragon@git+https://github.com/NIH-NCPI/search-dragon.git",
    "car-utils",
    "py-horned-owl>=1.4.1",
]

dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "rich",
    "pytest",
    "rich_argparse",
]

[tool.setuptools_scm]
#version_file = "src/tweaver/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.uv.sources]
car-utils = { git = "https://github.com/carrollaboratory/car-utils.git" }

[project.scripts]
weaver = "tweaver.weaver:exec"
owl_handle = "tweaver.owl_handler:exec"
